<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Agent 교육 — Challenge Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',-apple-system,sans-serif;background:#06080f;color:#e2e8f0;min-height:100vh}

/* Header */
.header{padding:2.5em 2em 1.5em;text-align:center;position:relative;overflow:hidden}
.header::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(99,102,241,.06),rgba(16,185,129,.04),rgba(139,92,246,.06));pointer-events:none}
.header h1{font-size:2.2em;font-weight:900;background:linear-gradient(135deg,#60a5fa,#a78bfa,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;position:relative}
.header p{color:#64748b;margin-top:.4em;font-size:.95em;position:relative}
.nav{display:flex;gap:12px;justify-content:center;margin-top:1em;position:relative}
.nav a{padding:8px 20px;border-radius:20px;font-size:.85em;font-weight:600;text-decoration:none;transition:all .2s;
  border:1px solid #334155;color:#94a3b8;background:rgba(30,41,59,.5)}
.nav a:hover{border-color:#6366f1;color:#a5b4fc;background:rgba(99,102,241,.08)}
.nav a.active{border-color:#6366f1;color:#fff;background:rgba(99,102,241,.15)}

/* Stats */
.stats{display:flex;justify-content:center;gap:1.5em;padding:1.5em 2em;flex-wrap:wrap}
.stat{background:linear-gradient(135deg,rgba(30,41,59,.8),rgba(30,41,59,.5));border:1px solid #334155;border-radius:16px;
  padding:1.2em 2.5em;text-align:center;min-width:140px;backdrop-filter:blur(8px)}
.stat .num{font-size:2.8em;font-weight:900;line-height:1;background:linear-gradient(135deg,#60a5fa,#a78bfa);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat .label{font-size:.8em;color:#64748b;margin-top:.3em;font-weight:500;letter-spacing:.5px;text-transform:uppercase}

/* Container */
.container{max-width:1300px;margin:0 auto;padding:0 2em 3em}

/* Challenge Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
.card{background:linear-gradient(135deg,rgba(30,41,59,.6),rgba(30,41,59,.3));border:1px solid #334155;
  border-radius:16px;overflow:hidden;transition:all .3s;backdrop-filter:blur(4px)}
.card:hover{border-color:#475569;transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.3)}
.card.has-completions{border-color:rgba(52,211,153,.3)}
.card-top{padding:1.2em 1.5em;display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid rgba(51,65,85,.5)}
.card-top h3{font-size:1.05em;font-weight:700;color:#f1f5f9}
.count-badge{font-size:.8em;font-weight:700;padding:4px 14px;border-radius:14px;
  background:rgba(51,65,85,.5);color:#94a3b8}
.count-badge.active{background:linear-gradient(135deg,rgba(52,211,153,.15),rgba(6,182,212,.1));color:#34d399;
  box-shadow:0 0 12px rgba(52,211,153,.1)}
.card-desc{padding:.6em 1.5em;color:#64748b;font-size:.82em;border-bottom:1px solid rgba(51,65,85,.3);
  font-family:'Cascadia Code',monospace}
.completions{padding:.5em 1.2em 1em;max-height:220px;overflow-y:auto}
.completions::-webkit-scrollbar{width:4px}
.completions::-webkit-scrollbar-thumb{background:#334155;border-radius:2px}
.completion{display:flex;align-items:center;gap:.8em;padding:.6em .3em;
  border-bottom:1px solid rgba(51,65,85,.3);animation:fadeIn .3s ease}
.completion:last-child{border-bottom:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.rank{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:.72em;font-weight:800;flex-shrink:0}
.completion:nth-child(1) .rank{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1e293b;box-shadow:0 2px 8px rgba(251,191,36,.3)}
.completion:nth-child(2) .rank{background:linear-gradient(135deg,#94a3b8,#64748b);color:#1e293b}
.completion:nth-child(3) .rank{background:linear-gradient(135deg,#cd7f32,#a0522d);color:#fff}
.completion:nth-child(n+4) .rank{background:#1e293b;color:#64748b;border:1px solid #334155}
.info{flex:1;min-width:0}
.info .name{font-size:.92em;font-weight:600;color:#f1f5f9}
.info .dept{font-size:.75em;color:#64748b}
.time{font-size:.7em;color:#475569;font-family:monospace}
.empty{padding:1.8em;text-align:center;color:#334155;font-size:.85em}

/* Footer */
.footer{text-align:center;padding:1.5em;color:#334155;font-size:.75em}
.footer .dot{display:inline-block;width:6px;height:6px;background:#22c55e;border-radius:50%;margin-right:6px;
  animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

@media(max-width:768px){.grid{grid-template-columns:1fr}.stats{gap:.8em}.stat{padding:1em 1.5em}}
</style>
</head>
<body>

<div class="header">
  <h1>LLM Agent 교육 Challenge</h1>
  <p>과제를 풀고, SSO 토큰과 함께 정답을 제출하세요</p>
  <div class="nav">
    <a href="/" class="active">대시보드</a>
    <a href="/challenges/prompt">프롬프트 과제</a>
    <a href="/settings">설정</a>
  </div>
</div>

<div class="stats" id="stats">
  <div class="stat"><div class="num" id="total-challenges">-</div><div class="label">과제</div></div>
  <div class="stat"><div class="num" id="total-completions">-</div><div class="label">총 통과</div></div>
  <div class="stat"><div class="num" id="total-users">-</div><div class="label">참여자</div></div>
</div>

<div class="container">
  <div class="grid" id="grid"></div>
</div>

<div class="footer">
  <span class="dot"></span>실시간 업데이트 · 5초마다 자동 갱신
</div>

<script>
const API=window.location.origin;
async function fetchData(){
  try{
    const r=await fetch(API+'/completions');
    const d=await r.json();render(d);
  }catch(e){console.error(e)}
}
function render(data){
  const ch=data.challenges,ids=Object.keys(ch);
  let tc=0;const users=new Set();
  ids.forEach(id=>{const c=ch[id].completions;tc+=c.length;c.forEach(x=>users.add(x.sub))});
  document.getElementById('total-challenges').textContent=ids.length;
  document.getElementById('total-completions').textContent=tc;
  document.getElementById('total-users').textContent=users.size;
  document.getElementById('grid').innerHTML=ids.map(id=>{
    const c=ch[id],comps=c.completions||[],has=comps.length>0;
    const rows=comps.length?comps.map((x,i)=>`
      <div class="completion">
        <div class="rank">${i+1}</div>
        <div class="info"><div class="name">${esc(x.name)}</div><div class="dept">${esc(x.dept)}</div></div>
        <div class="time">${fmtTime(x.timestamp)}</div>
      </div>`).join(''):'<div class="empty">아직 통과자가 없습니다</div>';
    return`
      <div class="card ${has?'has-completions':''}">
        <div class="card-top"><h3>${esc(c.name)}</h3>
          <span class="count-badge ${has?'active':''}">${comps.length}명</span></div>
        <div class="card-desc">POST /challenges/${id}/submit</div>
        <div class="completions">${rows}</div>
      </div>`;
  }).join('');
}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function fmtTime(t){try{return new Date(t).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}catch{return t}}
fetchData();setInterval(fetchData,5000);
</script>
</body>
</html>
