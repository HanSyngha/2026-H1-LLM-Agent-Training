<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Challenge Dashboard — LLM Agent 교육</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

  .header { text-align: center; padding: 2.5em 1em 1.5em; }
  .header h1 { font-size: 2em; font-weight: 800; background: linear-gradient(135deg, #60a5fa, #a78bfa, #34d399);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .header p { color: #64748b; margin-top: .5em; }

  .stats { display: flex; justify-content: center; gap: 1.5em; margin: 1em 0 2em; flex-wrap: wrap; }
  .stat { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1em 2em; text-align: center; min-width: 120px; }
  .stat .num { font-size: 2em; font-weight: 800; color: #60a5fa; }
  .stat .label { font-size: .8em; color: #64748b; margin-top: .2em; }

  .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5em 3em; }

  .challenge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.2em; }

  .challenge-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; overflow: hidden; transition: border-color .3s; }
  .challenge-card:hover { border-color: #475569; }
  .challenge-card.has-completions { border-color: rgba(52, 211, 153, .3); }

  .card-header { padding: 1.2em 1.5em; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
  .card-header h3 { font-size: 1.1em; font-weight: 700; color: #f1f5f9; }
  .card-header .count { background: #334155; color: #94a3b8; padding: 2px 10px; border-radius: 12px; font-size: .8em; font-weight: 600; }
  .card-header .count.active { background: rgba(52, 211, 153, .15); color: #34d399; }

  .card-desc { padding: .8em 1.5em; color: #94a3b8; font-size: .85em; border-bottom: 1px solid #334155; }

  .completions { padding: .5em 1.5em 1em; max-height: 200px; overflow-y: auto; }
  .completion { display: flex; align-items: center; gap: .8em; padding: .5em 0; border-bottom: 1px solid rgba(51,65,85,.5); }
  .completion:last-child { border-bottom: none; }
  .completion .rank { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: .7em; font-weight: 800; background: #334155; color: #94a3b8; flex-shrink: 0; }
  .completion:nth-child(1) .rank { background: #fbbf24; color: #1e293b; }
  .completion:nth-child(2) .rank { background: #94a3b8; color: #1e293b; }
  .completion:nth-child(3) .rank { background: #cd7f32; color: #1e293b; }
  .completion .info { flex: 1; }
  .completion .name { font-size: .9em; font-weight: 600; color: #f1f5f9; }
  .completion .dept { font-size: .75em; color: #64748b; }
  .completion .time { font-size: .7em; color: #475569; font-family: monospace; }

  .empty { padding: 1.5em; text-align: center; color: #475569; font-size: .85em; }

  .refresh-bar { text-align: center; padding: 1em; color: #475569; font-size: .75em; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .completion { animation: fadeIn .3s ease; }
</style>
</head>
<body>

<div class="header">
  <h1>LLM Agent 교육 Challenge</h1>
  <p>과제를 풀고, 정답과 SSO 토큰을 제출하세요</p>
</div>

<div class="stats" id="stats">
  <div class="stat"><div class="num" id="total-challenges">-</div><div class="label">과제</div></div>
  <div class="stat"><div class="num" id="total-completions">-</div><div class="label">총 통과</div></div>
  <div class="stat"><div class="num" id="total-users">-</div><div class="label">참여자</div></div>
</div>

<div class="container">
  <div class="challenge-grid" id="grid"></div>
</div>

<div class="refresh-bar" id="refresh-bar">데이터 로드 중...</div>

<script>
const API = window.location.origin;
let previousData = null;

async function fetchData() {
  try {
    const resp = await fetch(API + '/completions');
    const data = await resp.json();
    render(data);
    document.getElementById('refresh-bar').textContent =
      '마지막 업데이트: ' + new Date().toLocaleTimeString('ko-KR') + ' (5초마다 자동 갱신)';
  } catch (e) {
    document.getElementById('refresh-bar').textContent = '서버 연결 실패: ' + e.message;
  }
}

function render(data) {
  const grid = document.getElementById('grid');
  const challenges = data.challenges;
  const ids = Object.keys(challenges);

  // Stats
  let totalCompletions = 0;
  const allUsers = new Set();
  ids.forEach(id => {
    const comps = challenges[id].completions;
    totalCompletions += comps.length;
    comps.forEach(c => allUsers.add(c.sub));
  });

  document.getElementById('total-challenges').textContent = ids.length;
  document.getElementById('total-completions').textContent = totalCompletions;
  document.getElementById('total-users').textContent = allUsers.size;

  // Cards
  grid.innerHTML = ids.map(id => {
    const ch = challenges[id];
    const comps = ch.completions || [];
    const hasComps = comps.length > 0;

    const completionRows = comps.length > 0
      ? comps.map((c, i) => `
        <div class="completion">
          <div class="rank">${i + 1}</div>
          <div class="info">
            <div class="name">${escHtml(c.name)}</div>
            <div class="dept">${escHtml(c.dept)}</div>
          </div>
          <div class="time">${formatTime(c.timestamp)}</div>
        </div>`).join('')
      : '<div class="empty">아직 통과자가 없습니다</div>';

    return `
      <div class="challenge-card ${hasComps ? 'has-completions' : ''}">
        <div class="card-header">
          <h3>${escHtml(ch.name)}</h3>
          <span class="count ${hasComps ? 'active' : ''}">${comps.length}명 통과</span>
        </div>
        <div class="card-desc">제출: POST /challenges/${id}/submit</div>
        <div class="completions">${completionRows}</div>
      </div>`;
  }).join('');
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function formatTime(ts) {
  try {
    const d = new Date(ts);
    return d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  } catch { return ts; }
}

// 5초마다 자동 갱신
fetchData();
setInterval(fetchData, 5000);
</script>
</body>
</html>
